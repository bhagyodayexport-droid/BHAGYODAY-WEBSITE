<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review - Bhagyoday</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { 
    font-family: 'Manrope', sans-serif; 
    background-color: #f4f7f6; 
    margin: 0; 
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }
  .container { 
    max-width: 450px; 
    width: 100%;
    background: white; 
    padding: 40px 30px; 
    border-radius: 16px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
    text-align: center; 
  }
  .logo {
    font-size: 24px;
    font-weight: 800;
    color: #1A1A1A;
    margin-bottom: 5px;
    letter-spacing: -0.02em;
  }
  .logo span { color: #B91C1C; }
  h1 { 
    color: #1A1A1A; 
    font-size: 22px; 
    margin-top: 20px;
    margin-bottom: 10px;
  }
  p { 
    color: #6B7280; 
    margin-bottom: 30px; 
    font-size: 15px; 
    line-height: 1.5; 
  }
  .btn { 
    display: block; 
    width: 100%; 
    padding: 16px; 
    margin: 12px 0; 
    background-color: #B91C1C; /* Bhagyoday Red */
    color: white; 
    border: none; 
    border-radius: 8px; 
    font-size: 15px; 
    cursor: pointer; 
    transition: 0.2s; 
    font-weight: 600;
    font-family: 'Manrope', sans-serif;
  }
  .btn:active { transform: scale(0.98); }
  .btn:hover { background-color: #991B1B; }
  
  /* Loading screen that shows for half a second to make the transition feel like an app */
  #loader {
      display: none;
      margin-top: 20px;
      font-size: 16px;
      color: #B91C1C;
      font-weight: 800;
  }
</style>
</head>
<body>

<div class="container" id="main-content">
  <div class="logo">Bhagyoday <span>Roof</span></div>
  <h1>Rate Your Experience ⭐</h1>
  <p>Tap the product you purchased. We will write the review for you and send you straight to Google!</p>

  <button class="btn" onclick="leaveReview('Color Coated')">Color Coated Roofing Sheets</button>
  <button class="btn" onclick="leaveReview('ROOFY')">ROOFY® Standing Seam</button>
  <button class="btn" onclick="leaveReview('PUF Panels')">PUF Insulated Panels</button>
  <button class="btn" onclick="leaveReview('General')">Other Industrial Roofing</button>
</div>

<div class="container" id="loading-content" style="display: none;">
    <div class="logo">Bhagyoday <span>Roof</span></div>
    <h1 style="margin-top: 40px;">Opening Google...</h1>
    <p>Just hit <b>"Paste"</b> on the next screen!</p>
</div>

<script>
async function leaveReview(productName) {
  // 1. Show the loading transition instantly (hides the buttons)
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('loading-content').style.display = 'block';

  // 2. Pre-written 5-Star Templates
  const reviews = {
    'Color Coated': "I highly recommend Bhagyoday Roof Industries! We purchased their Color Coated Roofing Sheets and the material quality is outstanding. Fast dispatch and great service. ⭐⭐⭐⭐⭐",
    'ROOFY': "Incredible experience with Bhagyoday Roof Industries. Their ROOFY Zip-Up Standing Seam system is top-notch industrial quality with zero leaks. Highly recommended! ⭐⭐⭐⭐⭐",
    'PUF Panels': "Excellent manufacturer! We bought PUF Insulated Panels from Bhagyoday Roof Industries. The custom sizing was perfect and delivery was on time. Great team to work with. ⭐⭐⭐⭐⭐",
    'General': "We had a great experience with Bhagyoday Roof Industries. They have 35 years of expertise, supply premium industrial roofing materials, and are highly professional. Highly recommend! ⭐⭐⭐⭐⭐"
  };

  const reviewText = reviews[productName];

  try {
    // 3. Silently copy to clipboard
    await navigator.clipboard.writeText(reviewText);
  } catch (err) {
    console.error('Silent copy failed', err);
  }

  // 4. Redirect instantly (Wait just 600 milliseconds so the user reads "Opening Google...")
  setTimeout(() => {
    // Make sure this is your EXACT Google Business "Ask for Reviews" link!
    window.location.href = "https://share.google/zXdR7B8Uf8RuzBOsp"; 
  }, 600);
}
</script>

</body>
</html>
